  - key: advisory_ceiling
    aliases:
      - "advisory ceiling"
      - "ceiling"
      - "advisory cap"
    en: >-
      The advisory ceiling is a deterministic check applied after every verdict is
      produced: FORESHORE may be more cautious than the governing IMD Coastal Bulletin
      for the area, but it can never be more permissive. Whenever a verdict would allow
      more than the bulletin permits, it is downgraded automatically, and the reason is
      shown.
    ta: >-
      ஆலோசனை உச்சவரம்பு என்பது ஒவ்வொரு தீர்ப்புக்குப் பிறகும் பயன்படுத்தப்படும்
      உறுதியான சரிபார்ப்பு: அந்தப் பகுதிக்கான ஆளும் IMD கடலோர அறிவிப்பை விட
      FORESHORE அதிக எச்சரிக்கையுடன் இருக்கலாம், ஆனால் அதை விட எப்போதும் தளர்வாக
      இருக்க முடியாது. அறிவிப்பு அனுமதிப்பதை விட ஒரு தீர்ப்பு அதிகமாக அனுமதித்தால்,
      அது தானாகவே தரம் தாழ்த்தப்படும், காரணமும் காட்டப்படும்.
    sourced_from: null
