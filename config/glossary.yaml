  - key: verdict_levels
    aliases:
      - "verdict levels"
      - "the three verdicts"
      - "advisory levels"
      - "go with caution"
      - "do not advise"
      - "verdict"
    en: >-
      FORESHORE settles every question about going to sea into exactly three levels:
      go, go with caution, or do not advise. The last of those is a designed outcome
      for missing, stale or contradictory evidence — not an error — and it always hands
      off to a named authority: the nearest landing centre, or the Coast Guard.
    ta: >-
      கடலுக்குச் செல்வதா என்ற ஒவ்வொரு கேள்விக்கும் FORESHORE மூன்று நிலைகளில்
      ஒன்றாகவே முடிவெடுக்கிறது: போகலாம், எச்சரிக்கையுடன் போகலாம், அல்லது ஆலோசனை
      தர முடியாது. கடைசி நிலை, தகவல் இல்லாத, காலாவதியான அல்லது முரண்பட்ட
      ஆதாரங்களுக்கான வடிவமைக்கப்பட்ட முடிவு — பிழை அல்ல — மேலும் அது எப்போதும் ஒரு
      பெயரிடப்பட்ட அதிகாரத்திடம் ஒப்படைக்கும்: அருகிலுள்ள தரையிறங்கும் மையம், அல்லது
      கடலோர காவல் படை.
