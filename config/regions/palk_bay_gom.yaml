region_id: palk_bay_gom
display_name_en: Palk Bay & Gulf of Mannar
display_name_local: பாக் விரிகுடா மற்றும் மன்னார் வளைகுடா
bbox: [78.0, 8.0, 80.6, 10.9]          # minlon, minlat, maxlon, maxlat (EPSG:4326)
timezone: Asia/Kolkata
# English-only for now, answers included. UI chrome, alert copy and legends render in
# primary_language, and answers are pinned separately by FORESHORE_LANGUAGE_LOCK
# (orchestrator.py, defaults to en) because the no-model template path splices English
# tool strings into the answer and a half-Tamil verdict is worse than an English one.
# `ta` stays listed in `languages` and detection still resolves it (test_language.py) —
# this is a gate, not a removal. Lift both pins together once Bhashini is in and the
# tool-level strings are localised.
primary_language: en
fallback_language: en
languages: [en, ta]          # known + detectable
surface_languages: [en]      # allowed to reach a screen — add `ta` to lift the pin

anchor_ports:
  - name: Rameswaram
    lat: 9.2876
    lon: 79.3129
    district: Ramanathapuram
  - name: Nagapattinam
    lat: 10.7660
    lon: 79.8450
    district: Nagapattinam
  - name: Tuticorin
    lat: 8.7642
    lon: 78.1348
    district: Thoothukudi

# Named working grounds, used as the destination when a route question does not name
# one ("what is the safest route for a fishing vessel?"). Operational endpoints chosen
# for this coast, in the same class as anchor_ports — a fisheries office's choice, not a
# measurement — which is why they live here and not in planner.py. Without them the
# planner defaulted a route's destination to its own origin and A* returned a 0.0 nm
# route, a router that never ran dressed up as an answer.
#
# The two chosen sit either side of Rameswaram so a route to them crosses the interesting
# water: the Palk Bay ground lies north of the Pamban channel toward the 1974 historic-
# waters line, the Gulf of Mannar ground south of it past the Marine National Park. Both
# are inside the region bbox and in water the routing depth floor accepts.
fishing_grounds:
  - name: Palk Bay grounds north of Pamban
    lat: 9.5200
    lon: 79.3600
    district: Ramanathapuram
  - name: Gulf of Mannar grounds south of Rameswaram
    lat: 8.9800
    lon: 79.1200
    district: Ramanathapuram

districts: [Ramanathapuram, Pudukkottai, Thanjavur, Nagapattinam, Thoothukudi, Tirunelveli]

sources:
  imd_coastal_office_id: 6              # ACWC Chennai
  imd_bulletin_coast_block: "South Tamilnadu coast"
  imd_bulletin_fallback_blocks: ["North Tamilnadu coast"]
  incois_pfz_sector: SEC006             # SOUTH TAMILNADU
  incois_hab_sector: "Gulf of Manmar (GoM)"
  imbl_line_filter: "%Sri Lanka%"
  imbl_historic_waters_line_ids: [1306]
  imbl_maritime_boundary_line_ids: [1307, 1310, 1311]

coast_guard:
  name: Indian Coast Guard — Maritime Rescue
  contact: "1554"

geofences:
  mpa:
    - id: gom_marine_national_park
      name_en: Gulf of Mannar Marine National Park
      name_local: மன்னார் வளைகுடா கடல் தேசிய பூங்கா
      source_file: mpa_gulf_of_mannar.geojson

routing:
  grid_deg: 0.01
  min_depth_m: 3.0

basemap:
  wms_url: "https://bhuvan-vec1.nrsc.gov.in/bhuvan/wms"
  layer: "india3"
  attribution: "ISRO / NRSC Bhuvan"
  center: [9.3, 79.2]
  zoom: 8
  # Fallback chart. The Bhuvan tile server currently answers every GetMap with a
  # ServiceExceptionReport (a Postgres auth failure on ISRO's own backend), which left
  # the map as a flat blue rectangle. GEBCO is the bathymetric source already listed in
  # CLAUDE.md's source table, is keyless, and returns real tiles — so an unreachable
  # ISRO basemap degrades to a real marine chart rather than to nothing. Named in
  # config, never in the component.
  fallback:
    wms_url: "https://wms.gebco.net/mapserv"
    layer: "GEBCO_LATEST"
    attribution: "GEBCO Compilation Group"
    label: "GEBCO bathymetric chart"
