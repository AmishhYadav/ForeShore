region_id: gujarat_sir_creek
display_name_en: Sir Creek & Gulf of Kutch
display_name_local: સર ક્રીક અને કચ્છનો અખાત
bbox: [68.0, 21.8, 71.5, 24.2]
timezone: Asia/Kolkata
# English-first for now: the UI chrome, alert copy and legends all render in the
# region's primary_language, and mixed-language chrome was unreadable. Detection
# still mirrors the user — a Gujarati query is answered in Gujarati — because gu is
# still listed in `languages`. Flip primary_language back when the full
# Gujarati surface is finished.
primary_language: en
fallback_language: en
languages: [en, gu]

anchor_ports:
  - name: Okha
    lat: 22.4707
    lon: 69.0708
    district: Devbhumi Dwarka
  - name: Porbandar
    lat: 21.6417
    lon: 69.6293
    district: Porbandar
  - name: Jakhau
    lat: 23.2200
    lon: 68.7100
    district: Kachchh

districts: [Kachchh, Devbhumi Dwarka, Jamnagar, Porbandar, Morbi]

sources:
  imd_coastal_office_id: 3              # CWC Ahmedabad — governs the Gujarat coast
  imd_bulletin_coast_block: "North Gujrath coast"   # IMD's own spelling — verified live
  imd_bulletin_fallback_blocks: ["South Gujrath coast"]
  incois_pfz_sector: SEC001
  incois_hab_sector: "Gulf of Kutch (GoK)"
  imbl_line_filter: "%Pakistan%"
  imbl_historic_waters_line_ids: []
  imbl_maritime_boundary_line_ids: []

coast_guard:
  name: Indian Coast Guard — Maritime Rescue
  contact: "1554"

geofences:
  mpa:
    - id: gok_marine_national_park
      name_en: Gulf of Kutch Marine National Park
      name_local: કચ્છનો અખાત દરિયાઈ રાષ્ટ્રીય ઉદ્યાન
      source_file: mpa_gulf_of_kutch.geojson

routing:
  grid_deg: 0.01
  min_depth_m: 3.0

basemap:
  wms_url: "https://bhuvan-vec1.nrsc.gov.in/bhuvan/wms"
  layer: "india3"
  attribution: "ISRO / NRSC Bhuvan"
  center: [22.6, 69.3]
  zoom: 8
  # Fallback chart. The Bhuvan tile server currently answers every GetMap with a
  # ServiceExceptionReport (a Postgres auth failure on ISRO's own backend), which left
  # the map as a flat blue rectangle. GEBCO is the bathymetric source already listed in
  # CLAUDE.md's source table, is keyless, and returns real tiles — so an unreachable
  # ISRO basemap degrades to a real marine chart rather than to nothing. Named in
  # config, never in the component.
  fallback:
    wms_url: "https://wms.gebco.net/mapserv"
    layer: "GEBCO_LATEST"
    attribution: "GEBCO Compilation Group"
    label: "GEBCO bathymetric chart"
