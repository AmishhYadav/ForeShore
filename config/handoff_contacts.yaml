# Handoff contact directory.
#
# DO_NOT_ADVISE must hand off to a *named, contactable* human (CLAUDE.md invariant 2).
# The INCOIS PFZ_LandingCentres layer gives 541+ named centres with district and
# position, but carries no telephone numbers at all — which is why the UI used to say
# "contact not on file". This file supplies the missing contact layer.
#
# ── Verification, and why it matters ────────────────────────────────────────────────
# Every entry carries `verified`. Only `verified: true` entries are real, published,
# checkable numbers; the UI renders those as dialable `tel:` links. Everything with
# `verified: false` is a DEMO placeholder invented for the SIH demo so that different
# landing centres show different names, roles and numbers — it is rendered as plain
# text with a "DEMO DIRECTORY" pill and is never dialable. The subscriber blocks used
# below (`000 xxx`) are not allocated in the Indian numbering plan, so no such entry can
# reach a real person even if someone dials it by hand.
#
# Replacing this with a real fisheries directory is a config edit, not a code change.
# Region specifics live here, never in application logic (CLAUDE.md invariant 6).

meta:
  directory_name: FORESHORE demo handoff directory
  note: >-
    Landing-centre telephone numbers are demonstration placeholders. Only the Indian
    Coast Guard number 1554 is a real, published emergency number.

# Real, published, national. The one number that is always offered as a live link.
coast_guard:
  authority_name: Indian Coast Guard — Maritime Rescue
  authority_type: coast_guard
  contact: "1554"
  contact_label: Maritime distress
  vhf_channel: Ch 16
  verified: true

# Per-district fallback: used when a landing centre has no entry of its own. District
