services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: foreshore-postgis
    environment:
      POSTGRES_USER: foreshore
      POSTGRES_PASSWORD: foreshore
      POSTGRES_DB: foreshore
    ports:
      - "55432:5432"
    volumes:
      - foreshore_pgdata:/var/lib/postgresql/data
      - ./scripts/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreshore -d foreshore"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  foreshore_pgdata:
